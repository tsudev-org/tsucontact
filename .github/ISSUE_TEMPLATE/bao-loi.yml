name: Báo lỗi / Bug report
description: Tsu Contact chạy sai hoặc tạo vCard sai
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Lỗ hổng bảo mật: KHÔNG báo ở đây - xem SECURITY.md. Đừng đính kèm danh bạ thật; dùng tệp CSV giả lập.
  - type: input
    id: phien-ban
    attributes:
      label: Phiên bản / Version
      placeholder: 26.11.1601
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2
  - type: textarea
    id: tai-hien
    attributes:
      label: Các bước tái hiện / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: mong-doi
    attributes:
      label: Mong đợi và thực tế / Expected vs actual
    validations:
      required: true
