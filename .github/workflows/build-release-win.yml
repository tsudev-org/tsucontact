# Đẩy tag `v<APP_VERSION>` -> build .exe trên Windows, sinh SBOM, ký chứng thực nguồn gốc bản build
# (SLSA build provenance, miễn phí với repo public), đính .exe + SBOM + SHA256SUMS vào Release.
# Người tải kiểm: gh attestation verify <file>.exe --repo tsudev-org/tsucontact
# SHA256SUMS.txt cũng được ký (Sigstore), bundle đính kèm: SHA256SUMS.txt.sigstore.json
name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write        # tạo/đính file vào Release
      id-token: write        # chứng thực nguồn gốc (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Cài phụ thuộc đã khóa (--require-hashes)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Chạy test (lõi + giao diện)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests

      # Chỉ đối chiếu khi chạy theo tag; chạy tay từ tab Actions thì ref_name là tên nhánh.
      - name: Đối chiếu tag với APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $appVersion = python -c "from src.app_info import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:TAG -replace '^v', ''
          if ($tagVersion -ne $appVersion) {
            throw "Tag '$tagVersion' khác APP_VERSION '$appVersion' - sửa src/app_info.py hoặc đặt lại tag."
          }

      - name: Đóng gói (exe + SBOM + SHA256SUMS)
        shell: pwsh
        run: .\scripts\build-win.ps1 -SkipDeps -SkipTests

      # Ký Sigstore (keyless, OIDC của workflow) cho .exe, SBOM VÀ SHA256SUMS.txt: SHA256SUMS có chữ ký, kiểm được bằng
      # gh attestation verify SHA256SUMS.txt --repo tsudev-org/tsucontact (phiếu 20261115-01 mục 2.1).
      - name: Chứng thực nguồn gốc bản build + ký SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.cdx.json
            release/SHA256SUMS.txt

      # Bản bundle Sigstore đi kèm Release để kiểm ngoại tuyến: gh attestation verify <tệp> --bundle <bundle> --repo ...
      - name: Đặt bundle chữ ký cạnh SHA256SUMS
        shell: pwsh
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE release\SHA256SUMS.txt.sigstore.json

      - name: Lưu sản phẩm build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsucontact-windows
          path: release/*

      - name: Đính vào Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem release\* | ForEach-Object FullName) --clobber

  # DISTRIBUTION_TRUST.md mục 3: mọi tệp .exe của Release được gửi lên VirusTotal, link báo cáo ghi vào Release
  # notes; có engine gắn cờ ⇒ Release về nháp + job đỏ (mở phiếu báo nhầm, hạn 48 giờ). Chưa có VT_API_KEY của tổ
  # chức ⇒ job xanh, bỏ qua. Phiếu 20261120-TR1, TR1-b.
  virustotal:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # tsudev-org/.github @ 8a393eb (feat(ci): workflow dung chung quet VirusTotal, #4)
    uses: tsudev-org/.github/.github/workflows/virustotal.yml@8a393ebd89349300637c8c57e89c12492b174e4d
    with:
      tag: ${{ github.ref_name }}
      patterns: "tsucontact_*.exe"
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

  # THỬ NGHIỆM (chỉ chạy tay): dựng các biến thể để đo báo nhầm trên VirusTotal. Xoá sau khi chốt phương án.
  thu-nghiem-av:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Cài phụ thuộc đã khóa
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: B0 - onedir + Inno (bootloader dựng sẵn)
        shell: pwsh
        run: |
          $env:TSU_ONEDIR = '1'
          python -m PyInstaller --noconfirm --clean --distpath out\b0 tsucontact.spec
          if ($LASTEXITCODE) { throw 'pyinstaller' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppVersion=26.11.2101 /DSourceDir=$PWD\out\b0\tsucontact /DOutputBase=b0-onedir-inno /O$PWD\av packaging\inno\tsucontact.iss
          if ($LASTEXITCODE) { throw 'iscc' }
      - name: Dựng bootloader PyInstaller từ nguồn
        shell: pwsh
        run: |
          python -c "import re;s=open('requirements-dev.txt').read();m=re.search(r'^pyinstaller==.*?(?=^\S)',s,re.S|re.M);open('pyi.txt','w').write(m.group(0))"
          $env:PYINSTALLER_COMPILE_BOOTLOADER = '1'
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --force-reinstall --no-binary pyinstaller -r pyi.txt
          if ($LASTEXITCODE) { throw 'pip' }
      - name: A - onefile (bootloader tự dựng)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath out\a tsucontact.spec
          if ($LASTEXITCODE) { throw 'pyinstaller' }
          Copy-Item out\a\*.exe av\a-onefile-src.exe
      - name: B - onedir + Inno (bootloader tự dựng)
        shell: pwsh
        run: |
          $env:TSU_ONEDIR = '1'
          python -m PyInstaller --noconfirm --clean --distpath out\b tsucontact.spec
          if ($LASTEXITCODE) { throw 'pyinstaller' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppVersion=26.11.2101 /DSourceDir=$PWD\out\b\tsucontact /DOutputBase=b-onedir-inno-src /O$PWD\av packaging\inno\tsucontact.iss
          if ($LASTEXITCODE) { throw 'iscc' }
          Copy-Item out\b\tsucontact\tsucontact.exe av\b-app-exe-src.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-nghiem-av
          path: av/*
